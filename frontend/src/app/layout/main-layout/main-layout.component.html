<div class="flex h-screen overflow-hidden bg-[#0b1326]">
  <app-sidebar></app-sidebar>
  <!-- Narrow screens: the sidebar is a drawer, and this scrim closes it. -->
  @if (drawer.open()) {
    <div class="fixed inset-0 z-30 bg-black/50 md:hidden" (click)="drawer.close()" aria-hidden="true"></div>
  }
  <div class="flex min-w-0 flex-1 flex-col md:ml-64">
    <app-header></app-header>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
