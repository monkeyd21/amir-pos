# nginx vhost for the storefront. Routed by HOSTNAME, alongside the ERP vhost:
#
#   erp.sabihasethnic.com   → 127.0.0.1:3000  (Express + Angular admin/POS)
#   shop.sabihasethnic.com  → 127.0.0.1:3001  (Next.js storefront)
#
# Install:
#   sudo cp deploy/nginx-amir-shop.conf /etc/nginx/sites-available/amir-shop
#   sudo ln -s /etc/nginx/sites-available/amir-shop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.sabihasethnic.com
server {
    listen 80;
    listen [::]:80;
    server_name shop.sabihasethnic.com;

    # Nothing is uploaded through this vhost (photos go up via the ERP), so
    # request bodies here stay small.
    client_max_body_size 2m;

    # Product photos, straight from disk: nginx answers these without waking
    # Node, so shoppers browsing pictures never slow the till. Keys are unique
    # and never reused, so every file can be cached for a year. This is the
    # interim home; the plan is object storage behind a CDN (PLAN.md §5).
    location /media/ {
        alias /opt/amir-pos/media/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Next.js fingerprints its build assets, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The payment webhook is served by the Express app, not Next. Point the
    # gateway at shop.sabihasethnic.com/api/shop/v1/webhooks/payment and it
    # lands on the right process.
    location /api/shop/v1/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The raw body must survive intact — the signature is computed over it.
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
    }
}
